        <g fill="#f7fbf3"><text x="752" y="44" font-size="12" opacity=".65" font-weight="700" letter-spacing="1">ATTENTION NEEDED</text><text x="752" y="91" font-size="24" font-weight="800">1 moisture alert</text><text x="752" y="123" font-size="13" opacity=".78">Maharashtra · Field 04</text><rect x="752" y="168" width="414" height="1" fill="#3c6245"/><text x="752" y="205" font-size="13" opacity=".72">Last reading 34 minutes ago</text><text x="752" y="244" font-size="13" font-weight="700" fill="#d8e68a">Review alert →</text></g>
      </g>
      <g transform="translate(0 578)" filter="url(#shadow)">
        <rect width="1196" height="260" rx="18" fill="#ffffff"/><text x="26" y="40" font-size="18" fill="#173b28" font-weight="800">Farmers &amp; fields</text><text x="26" y="64" font-size="12" fill="#7b8b80">Monitor field activity, irrigation, and open alerts.</text><rect x="844" y="22" width="140" height="36" rx="9" fill="#f1f4ee"/><text x="872" y="45" font-size="12" fill="#53635a">Filters</text><rect x="1000" y="22" width="168" height="36" rx="9" fill="#173b28"/><text x="1030" y="45" font-size="12" fill="#f7fbf3" font-weight="700">Export report</text>
        <rect x="26" y="92" width="1144" height="42" rx="8" fill="#f5f7f3"/><g font-size="11" fill="#7b8b80" font-weight="700"><text x="42" y="118">FIELD</text><text x="320" y="118">STATE</text><text x="528" y="118">NEXT IRRIGATION</text><text x="738" y="118">STATUS</text><text x="1026" y="118">AREA</text></g><g font-size="13" fill="#44554b"><text x="42" y="166">Maharashtra / Field 04</text><text x="320" y="166">Maharashtra</text><text x="528" y="166">Today, 4:30 PM</text><rect x="738" y="148" width="90" height="26" rx="13" fill="#fff0ed"/><text x="756" y="165" fill="#b64b36" font-size="11">Needs review</text><text x="1026" y="166">8.42 acres</text><line x1="26" x2="1170" y1="188" y2="188" stroke="#e7ece6"/><text x="42" y="220">Madhya Pradesh / Field 02</text><text x="320" y="220">Madhya Pradesh</text><text x="528" y="220">Tomorrow, 6:00 AM</text><rect x="738" y="202" width="74" height="26" rx="13" fill="#e7f3e9"/><text x="754" y="219" fill="#2e6b3e" font-size="11">Healthy</text><text x="1026" y="220">5.18 acres</text></g>
      </g>
    </g>
    <g transform="translate(1340 952)" fill="#6e8074" font-size="11"><text x="0" y="0">DESIGN DIRECTION · MINIMAL FIELD OPS</text></g>
