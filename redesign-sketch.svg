        <circle cx="224" cy="160" r="86" fill="none" stroke="#e9eee8" stroke-width="30"/><path d="M224 74 A86 86 0 1 1 148 201" fill="none" stroke="#a87b00" stroke-width="30"/><path d="M148 201 A86 86 0 0 1 135 126" fill="none" stroke="#6f89d7" stroke-width="30"/><circle cx="224" cy="160" r="50" fill="#fff"/><text x="198" y="157" font-size="24" fill="#173b28" font-weight="800">23.08</text><text x="208" y="177" font-size="11" fill="#7b8b80">ACRES</text>
