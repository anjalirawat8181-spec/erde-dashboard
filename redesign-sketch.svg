<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Erde Agro dashboard redesign sketch</title>
  <desc id="desc">Low-fidelity annotated wireframe showing a left navigation rail, top bar, summary metric cards, crop mix, attention panel, and farmers and fields table.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#dfe6df" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#173b28" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f7f8f4"/>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#grid)" opacity=".45"/>
  <rect x="0" y="0" width="1600" height="74" fill="#0d321d"/>
  <g font-family="Inter, Arial, sans-serif">
    <g fill="#f7fbf3">
      <circle cx="34" cy="37" r="16" fill="#c9db50"/><path d="M34 24v26M21 37h26M25 28l18 18M43 28L25 46" stroke="#0d321d" stroke-width="2"/>
      <text x="62" y="34" font-size="18" font-weight="700" letter-spacing="1">ERDE AGRO</text>
      <text x="62" y="52" font-size="8" opacity=".7" letter-spacing="2">ORGANISING AGRICULTURE</text>
      <text x="1390" y="44" font-size="15">Erde Agro Ecosystems</text>
      <circle cx="1360" cy="37" r="17" fill="#3e7341"/>
      <text x="1354" y="43" font-size="14">E</text>
    </g>
    <rect x="0" y="74" width="274" height="926" fill="#f1f4ee" stroke="#dfe6df"/>
    <g fill="#809086" font-size="12" font-weight="600" letter-spacing="1">
      <text x="28" y="121">WORKSPACE</text><text x="28" y="223">MANAGE</text>
    </g>
    <g font-size="15" fill="#4d5e54"><rect x="18" y="140" width="238" height="44" rx="12" fill="#dfeadb"/><circle cx="42" cy="162" r="7" fill="#2e6b3e"/><text x="63" y="168" fill="#173b28" font-weight="700">Overview</text><rect x="32" y="207" width="14" height="14" rx="3" fill="#a9b8ad"/><text x="63" y="219">Fields</text><rect x="32" y="253" width="14" height="14" rx="3" fill="#a9b8ad"/><text x="63" y="265">Farmers</text><rect x="32" y="299" width="14" height="14" rx="3" fill="#a9b8ad"/><text x="63" y="311">Reports</text></g>
    <rect x="22" y="808" width="230" height="142" rx="16" fill="#dfeadb"/>
    <text x="40" y="840" font-size="12" fill="#5e7266" font-weight="700">FIELD HEALTH</text><text x="40" y="878" font-size="28" fill="#173b28" font-weight="800">92%</text><text x="40" y="901" font-size="11" fill="#5e7266">+4.8% from last month</text><path d="M150 902 C165 876, 175 892, 187 866 S210 876, 229 846" fill="none" stroke="#2e6b3e" stroke-width="4" stroke-linecap="round"/>
    <g transform="translate(320 118)">
      <text x="0" y="0" font-size="12" fill="#7b8b80" font-weight="700" letter-spacing="1">WEDNESDAY, 23 SEPTEMBER 2026</text><text x="0" y="50" font-size="34" fill="#173b28" font-weight="800">Good morning, team</text><text x="0" y="78" font-size="15" fill="#6a786f">A clear view of the farms and fields that need your attention today.</text>
      <rect x="1074" y="13" width="122" height="42" rx="11" fill="#173b28"/><text x="1108" y="39" font-size="13" fill="#f7fbf3" font-weight="700">+ Add field</text>
      <g transform="translate(0 118)" filter="url(#shadow)">
        <rect width="280" height="114" rx="16" fill="#ffffff"/><rect x="310" width="280" height="114" rx="16" fill="#ffffff"/><rect x="620" width="280" height="114" rx="16" fill="#ffffff"/><rect x="930" width="266" height="114" rx="16" fill="#ffffff"/>
        <g fill="#7b8b80" font-size="12" font-weight="700"><text x="24" y="30">TOTAL AREA</text><text x="334" y="30">ACTIVE FIELDS</text><text x="644" y="30">OPEN ALERTS</text><text x="954" y="30">FIELD HEALTH</text></g>
        <g fill="#173b28" font-size="30" font-weight="800"><text x="24" y="72">23.08 <tspan font-size="14" font-weight="500">acres</tspan></text><text x="334" y="72">7</text><text x="644" y="72">1</text><text x="954" y="72">92%</text></g>
        <g fill="#2e6b3e" font-size="11"><text x="24" y="96">+8.3% this season</text><text x="334" y="96">Across 2 states</text><text x="644" y="96">Needs review today</text><text x="954" y="96">+4.8% this month</text></g>
      </g>
